version: 3
purpose: >
  Locate the references an engineering-writing request needs. This file only
  routes; behavior rules live in SKILL.md and the shared files. No file here is
  mandatory, and output format follows the user's request.

request_modes:
  write:
    description: >
      Draft, compose, expand, or turn notes, figures, methods, tables, or
      results into manuscript prose.
    open_when:
      - draft
      - write
      - compose
      - turn notes into prose
      - abstract
      - introduction
      - methods
      - results
      - ablation
      - related work
      - discussion
      - conclusion
  plan:
    description: >
      Build paper plans, section plans, story maps, contribution designs, or
      writing order.
    open_when:
      - outline
      - plan
      - story
      - paper structure
      - writing order
    references:
      - ../_shared/writing-process.md
      - references/paper-workflow.md
  audit:
    description: >
      Review, diagnose, critique, or predict reviewer objections. Hand off to
      engineering-paper-auditor.
    open_when:
      - review
      - audit
      - diagnose
      - weaknesses
      - what will reviewers say

section_references:
  title:
    - references/title.md
  abstract:
    - references/abstract.md
  introduction:
    - references/introduction.md
    - ../_shared/reviewer-attack-patterns.md
  related_work:
    - references/related-work.md
    - ../_shared/citation-boundary.md
  methods:
    - references/methods.md
    - references/methods-worksheet.md
    - ../_shared/list-to-argument.md
    - ../_shared/reviewer-attack-patterns.md
  experiments:
    - references/experiments.md
    - references/experiments-worksheet.md
    - ../_shared/reviewer-attack-patterns.md
  discussion:
    - references/discussion.md
  conclusion:
    - references/conclusion.md
  full_paper:
    - ../_shared/writing-process.md
    - references/paper-workflow.md
    - references/paper-level-narrative-map.md
    - references/contribution-evidence.md
    - ../_shared/story-spine.md
  revision:
    - ../_shared/revision-moves.md
  ral_style_on_request:
    - references/ral-style-writing-guide.md
