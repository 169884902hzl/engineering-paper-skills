{
  "case": "full_paper_realistic_structured_audit",
  "prompt": "full_paper_realistic_structured_audit.md",
  "must_include": [
    "claim_evidence",
    "paragraph_transitions",
    "section_dependencies",
    "response_truthfulness",
    "validation_status",
    "NOT_RUN"
  ],
  "must_not_include": [
    "READY_FOR_SUBMISSION",
    "VERIFIED_CITATIONS",
    "OFFICIAL_POLICY_PASS"
  ],
  "required_status": {
    "official_venue_policy": "NOT_RUN"
  },
  "forbidden_claims": [
    "verified citations",
    "completed stress tests",
    "official venue compliance"
  ],
  "forbidden_regex": [
    "(?i)ready_for_submission",
    "(?i)verified_citations",
    "(?i)official_policy_pass"
  ],
  "json_expectations": {
    "required_top_level_keys": [
      "verdict",
      "claim_evidence",
      "paragraph_transitions",
      "section_dependencies",
      "response_truthfulness",
      "validation_status"
    ],
    "array_expectations": [
      {
        "name": "claim evidence rows",
        "path": "claim_evidence",
        "min_items": 4,
        "required_fields": [
          "claim_id",
          "claim",
          "status",
          "source_span",
          "evidence_span",
          "evidence_anchor",
          "decision",
          "forbidden_strengthening",
          "repair"
        ],
        "non_empty_fields": [
          "claim_id",
          "claim",
          "status",
          "source_span",
          "evidence_span",
          "decision",
          "forbidden_strengthening",
          "repair"
        ]
      },
      {
        "name": "paragraph transition rows",
        "path": "paragraph_transitions",
        "min_items": 3,
        "required_fields": [
          "from",
          "to",
          "relation",
          "issue",
          "terminology_drift",
          "claim_strength_drift",
          "repair"
        ],
        "non_empty_fields": [
          "from",
          "to",
          "relation",
          "issue",
          "terminology_drift",
          "claim_strength_drift",
          "repair"
        ]
      },
      {
        "name": "response truthfulness rows",
        "path": "response_truthfulness",
        "min_items": 3,
        "required_fields": [
          "reviewer_comment_id",
          "complaint_type",
          "response_claim",
          "status",
          "old_problem_span",
          "new_fix_span",
          "semantic_match",
          "manuscript_anchor",
          "remaining_gap",
          "repair"
        ],
        "non_empty_fields": [
          "reviewer_comment_id",
          "complaint_type",
          "response_claim",
          "status",
          "old_problem_span",
          "semantic_match",
          "remaining_gap",
          "repair"
        ]
      }
    ],
    "span_origin_checks": [
      {
        "name": "claim source and evidence spans come from fixture",
        "path": "claim_evidence",
        "fields": ["source_span", "evidence_span"],
        "source_file": "tests/fixtures/full_paper/robot_active_observation_realistic_8page.md",
        "min_source_token_coverage": 0.75
      }
    ],
    "issue_class_expectations": [
      {
        "name": "claim rows cover core issue classes",
        "output_path": "claim_evidence",
        "issues": [
          {
            "name": "local evidence to broad industrial overclaim",
            "accepted_statuses": ["FAIL", "OVERCLAIM", "UNSUPPORTED", "unsupported_overclaim"],
            "required_terms": ["one robot", "fixture"],
            "any_terms": ["industrial", "general", "manufacturing", "deployment"],
            "field_terms": {
              "repair": ["delete", "narrow", "bound", "downgrade"]
            }
          },
          {
            "name": "bounded 84 percent success result",
            "accepted_statuses": [
              "PASS_WITH_BOUNDARY",
              "SUPPORTED_WITH_BOUNDARY",
              "SUPPORTED_BOUNDED",
              "PARTIALLY_SUPPORTED_WITH_BOUNDARY",
              "supported_but_bounded"
            ],
            "required_terms": ["84 percent"],
            "any_terms": ["69 percent", "fixed overhead", "fixed-camera", "baseline"]
          },
          {
            "name": "causal ablation overclaim",
            "accepted_statuses": ["PARTIAL", "OVERCLAIM", "overstrong_causal_claim", "UNSUPPORTED_CAUSAL_STRENGTH"],
            "required_terms": ["causal"],
            "any_terms": ["no statistical", "statistics", "downgrade", "suggest"]
          }
        ]
      },
      {
        "name": "paragraph transition rows cover core issue classes",
        "output_path": "paragraph_transitions",
        "issues": [
          {
            "name": "related work to gap overreach",
            "required_terms": ["Related Work"],
            "any_terms": ["gap", "prior work", "citation", "placeholder"]
          },
          {
            "name": "methods module list to mechanism",
            "required_terms": ["Methods"],
            "any_terms": ["module", "state", "mechanism"]
          },
          {
            "name": "bounded limitation to conclusion or deployment risk",
            "any_terms": ["Conclusion", "deployment", "boundary", "industrial"]
          }
        ]
      },
      {
        "name": "response truthfulness rows cover concern classes",
        "output_path": "response_truthfulness",
        "issues": [
          {
            "name": "fake stress-test table or Table 3 claim",
            "accepted_statuses": ["UNSUPPORTED", "FALSE", "FALSE_FROM_SUPPLIED_EVIDENCE"],
            "required_terms": ["Table 3"],
            "any_terms": ["no completed", "not supplied", "no data"]
          },
          {
            "name": "unverified final line numbers",
            "accepted_statuses": ["UNVERIFIED", "PARTIAL"],
            "any_terms": [
              "line",
              "line-number",
              "line number",
              "final line",
              "not available",
              "not verified",
              "unverified",
              "NOT_RUN",
              "placeholder"
            ]
          }
        ]
      },
      {
        "name": "validation status refuses readiness",
        "output_path": "validation_status",
        "issues": [
          {
            "name": "not ready or cannot determine",
            "any_terms": ["NOT_READY", "CANNOT_DETERMINE", "CANNOT_MARK_READY", "AUDIT_COMPLETE_WITH_BLOCKERS"]
          },
          {
            "name": "official venue policy not run",
            "required_terms": ["NOT_RUN"],
            "any_terms": ["official_venue_policy", "venue", "policy"]
          }
        ]
      }
    ]
  },
  "allowed_behavior": [
    "return machine-readable JSON",
    "map claim IDs to evidence anchors and repairs",
    "mark official venue checks as NOT_RUN unless official sources were inspected"
  ]
}
