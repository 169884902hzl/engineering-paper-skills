name: Release Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_repo.py
      - run: python scripts/check_expected_behavior.py --spec-dir tests/expected --outputs-dir tests/outputs/golden
      - run: python scripts/check_quality_assets.py
      - run: python scripts/check_response_diff.py
      - run: python scripts/check_venue_profiles.py --refresh
      - name: Behavior regression must run for release gate
        run: |
          python scripts/run_prompt_regression.py \
            --require-command \
            --case full_paper_realistic_audit \
            --output-dir /tmp/engineering-paper-skill-regression \
            --command-template "$PROMPT_REGRESSION_COMMAND_TEMPLATE"
        env:
          PROMPT_REGRESSION_COMMAND_TEMPLATE: ${{ secrets.PROMPT_REGRESSION_COMMAND_TEMPLATE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-behavior-regression-output
          path: /tmp/engineering-paper-skill-regression
